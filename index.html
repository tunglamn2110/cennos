function overview(){return head('01 / Overview','Phân quyền CENNOS','Cluster × Role × Module')+`<h2 class="section-title">Module / menu đặc thù theo Cluster</h2><div class="grid3">${clusters.map(c=>`<button class="cluster" onclick="openMatrix('${c}','PM')"><b>${c}</b><span class="sub">${specials[c]}</span></button>`).join('')}</div><h2 class="section-title">Vai trò & trách nhiệm</h2><div class="rolecards">${roles.slice(1).map(r=>{let i=roles.indexOf(r);return `<button class="rolecard" onclick="openMatrix(cluster,'${r}')"><strong>${r} — ${defs[i][0]}</strong><span class="scope">${defs[i][1]}</span><p>${defs[i][2]}</p></button>`}).join('')}</div><h2 class="section-title">Vị trí gán quyền theo cấp</h2><div class="panel"><div class="hierarchy">${['Cluster','Group','Project','Process'].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${x}</span>`).join('')}</div>${tbl(['Cấp','Model','Role','Trường gán'],[['Cluster','cennos.cluster','PM','pm_ids'],['Group','cennos.group','Supervisor','supervisor_ids'],['Project','project.project','TL/RH · QA','leader_ids · qa_ids'],['Process','hc.process','Agent · QA','Agent Assignment · qa_ids']].map(r=>r.map(esc)))}</div>`}
function pickCluster(c){cluster=c;pg=0;render()}function pickRole(r){role=r;pg=0;assignAll=false;if(r==='Customer')mod='Website';else if(mod==='Website')mod='Timesheets';render()}function openMatrix(c,r){cluster=c;role=r;mod=r==='Customer'?'Website':'Timesheets';view='one';go(r==='Customer'?'portal':'matrix')}function pickMod(m){mod=m;render()}function pickView(v){view=v;render()}
function cval(rs,k,i){let terms={C:'Tạo',R:'Xem',U:'Sửa',D:'Xóa'};let matches=rs.filter(r=>r.typ!=='Button'&&(r.act.split(' / ').includes(terms[k])||(k==='R'&&(r.act.startsWith('Xem')||r.act.startsWith('Đọc dữ liệu')))));return matches.length?matches.some(r=>allowed(r,i))?'yes':'off':'unknown'}
function chips(rs,i){return `<div class="chips">${['C','R','U','D'].map(k=>`<span class="chip ${cval(rs,k,i)==='yes'?'':cval(rs,k,i)}" title="${({C:'Create',R:'Read',U:'Update',D:'Delete'})[k]}">${k}</span>`).join('')}</div>`}function compact(rs,i){let x=['C','R','U','D'].map(k=>cval(rs,k,i)==='yes'?k:cval(rs,k,i)==='unknown'?'?':'·').join('');let n=rs.filter(r=>r.typ==='Button'&&allowed(r,i)).length;return `<span class="compact ${rs.some(r=>allowed(r,i))?'':'none'}">${x}</span>${n?`<br><small class="muted">${n} action</small>`:''}`}
const businessRoles=['PM','Supervisor','TL/RH','QA','Agent'];
const noAccess=(rs,i)=>rs[0].pending?false:rs[0].access? !rs[0].access.includes(i):!rs.some(r=>allowed(r,i));
const isPending=(rs)=>rs[0].pending===true;
const accessText=(rs,i)=>isPending(rs)?'<span class="pending">Chưa có thông tin</span>':noAccess(rs,i)?'<span class="deny">Không truy cập</span>':chips(rs,i);
function target(){let gs=groups(mod);if(role==='Customer'&&view==='one')return portalRows();if(!gs.length)return `<div class="empty">${mod==='Website'?'Cần bổ sung thông tin phân quyền Portal User.':'Chưa có thông tin nghiệp vụ.'}</div>`;if(view==='all')return tbl(['Chức năng',...businessRoles],gs.map(([g,rs])=>[esc(g)+(rs[0].only?'<br>'+tag(rs[0].only,'special'):''),...businessRoles.map(r=>{let i=roles.indexOf(r);return isPending(rs)?'<span class="pending">—</span>':noAccess(rs,i)?'<span class="deny">Không truy cập</span>':compact(rs,i)})]),'compare');let i=ri();return tbl(['Chức năng','CRUD / Truy cập','Phạm vi dữ liệu','Button / Workflow'],gs.map(([g,rs])=>{let a=rs.filter(r=>allowed(r,i)),buttons=a.filter(r=>r.typ==='Button'),read=a.filter(r=>r.typ==='Dữ liệu xem'||r.act.includes('Xem'));let qual=a.filter(r=>r.rights[i]!=='x').map(r=>r.act+': '+r.rights[i].replace(/^x\s*/,''));let rules=a.filter(r=>r.rule);let lookup=read.some(r=>r.act.includes('không thấy menu'))&&!read.some(r=>r.act.includes('menu Process'));let denied=noAccess(rs,i),pending=isPending(rs);let scope=denied||pending?'—':(rs[0].scope?.[i]||defs[i][1]);return [`<b>${esc(g)}</b>${rs[0].only?'<br>'+tag(rs[0].only,'special'):''}${lookup?'<br>'+tag('Chỉ lookup','no'):''}${g==='Public Timesheet'&&role==='Agent'?'<div class="deny">Agent không được truy cập.</div>':''}`,accessText(rs,i),esc(scope)+(!denied&&!pending&&rs[0].filter?`<div class="filter-rule">${esc(rs[0].filter)}</div>`:'')+(qual.length?`<div class="rule">${esc(qual.join('\n'))}</div>`:''),buttons.length?buttons.map(r=>tag(r.act)).join(''):'<span class="muted">—</span>'].map((x,j)=>j===3&&rules.length&&!denied?x+`<details><summary>Điều kiện nghiệp vụ</summary>${rules.map(r=>`<div class="rule"><b>${esc(r.act)}</b> · ${esc(r.rule)}</div>`).join('')}</details>`:x)}))}
function matrix(){if(role==='Admin'||role==='Customer')role='PM';let ms=role==='Customer'&&view==='one'?['Website']:D.modules;if(!ms.includes(mod))mod=ms[0];return head('02 / Access matrix','Ma trận phân quyền','Chọn Cluster, Role và Module để tra cứu.')+`<div class="panel">${clusterbar()}<div class="divider"></div>${rolebar()}${roleinfo()}</div><div class="workspace"><div class="modulelist"><div class="eyebrow" style="padding:8px">Module</div>${ms.map(m=>`<button class="module ${m===mod?'active':''}" onclick="pickMod('${m}')">${m}</button>`).join('')}</div><div class="tablepanel"><div class="panelhead"><div><h2>${mod}</h2><div class="sub">${cluster} / ${view==='all'?'Tất cả Role':role}</div></div><div class="tabs"><button class="${view==='one'?'active':''}" onclick="pickView('one')">Theo Role</button><button class="${view==='all'?'active':''}" onclick="pickView('all')">So sánh Role</button></div></div><div style="padding:0 13px"><div class="legend"><span>● Xanh: có quyền</span><span>· Xám: không cấp</span><span>Không truy cập: đỏ</span><span>C Tạo · R Xem · U Sửa · D Xóa</span></div></div>${target()}</div></div>`}
function portalRows(){let rows=D.portal.filter(r=>r[0]!==123||cluster==='CE');return tbl(['Chức năng','Phạm vi dữ liệu','Thao tác','Điều kiện hiển thị'],rows.map(r=>[esc(r[2].split(' — ')[0]),esc(r[5]),esc(r[6]),esc(r[7])]),'portal-table')}
function portal(){return head('04 / Portal','Customer Portal','Phân quyền khách hàng theo phạm vi được gán.')+`<div class="panel">${clusterbar()}<div class="hierarchy">${['Cluster','Group','Project','Process'].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${x}</span>`).join('')}</div><div class="sub">Gán tại cấp nào, xem dữ liệu cấp đó và cấp con. Không cấp quyền Backend.</div></div><div class="tablepanel">${portalRows()}</div>`}
function assign(){let rows=D.assign.filter(r=>r[7]===cluster&&(assignAll||r[5]===(role==='TL/RH'?'Team Leader':role))&&r.join(' ').toLowerCase().includes(q.toLowerCase()));let max=Math.max(1,Math.ceil(rows.length/35));pg=Math.min(pg,max-1);return head('03 / Assignment','Gán quyền nhân viên','User · Role · Data Scope')+`<div class="panel">${clusterbar()}<div class="divider"></div>${rolebar()}${assignAll?'<div class="roleinfo">Tất cả Role trong Cluster</div>':roleinfo()}</div><div class="panel"><div class="tools"><button class="btn ${assignAll?'primary':''}" onclick="assignAll=true;pg=0;render()">Tất cả Role</button><input id="query" value="${esc(q)}" placeholder="Tìm nhân viên, Group, Project, Process…"><span class="count">${rows.length} dòng</span><button class="btn" onclick="pg=Math.max(0,pg-1);render()" ${pg===0?'disabled':''}>Trước</button><span>${pg+1}/${max}</span><button class="btn" onclick="pg++;render()" ${pg===max-1?'disabled':''}>Sau</button></div></div><div class="tablepanel">${rows.length?tbl(['Mã NV','Tên nhân viên','Role','Scope','Group','Project','Process','Active'],rows.slice(pg*35,pg*35+35).map(r=>[r[3],r[4],r[5],r[6],r[8],r[9],r[10],r[11]].map(esc))):'<div class="empty">Không có dòng gán quyền phù hợp trong dữ liệu nguồn.</div>'}</div>`}
function dev(){let t=D.tests[devtab],idx=role==='Admin'?3:role==='QA'?13:({PM:4,Supervisor:7,'TL/RH':10,Agent:14}[role]+clusters.indexOf(cluster));let rows=t.filter(r=>D.modules.some(m=>devtab==='ACL / CRUD'?r[1].startsWith(m):r[0]===m||r[0].startsWith(m+' >')));let cv=v=>v==='✔'?tag('Có'):v==='—'?tag('Không','no'):esc(v||'—');return head('05 / DEV','Kiểm thử quyền thực tế','Kết quả kiểm thử ngày 24/11/2026 · dữ liệu lịch sử, chưa retest theo V4.')+`<div class="panel">${clusterbar()}<div class="divider"></div>${rolebar()}${roleinfo()}</div><div class="panel"><div class="tabs">${Object.keys(D.tests).map(k=>`<button class="${devtab===k?'active':''}" onclick="devtab='${k}';render()">${k}</button>`).join('')}</div>${role==='QA'?'<p class="sub">QA dùng một tài khoản test chung.</p>':''}</div><div class="tablepanel">${role==='Customer'?'<div class="empty">Không có kết quả test Customer trong bộ DEV.</div>':tbl(devtab==='ACL / CRUD'?['Nhóm','Chức năng','Model','Quyền thực tế']:['Module','Chức năng','Chi tiết','Quyền thực tế'],rows.map(r=>[esc(r[0]),esc(r[1]),esc(r[2]),cv(r[idx])]))}</div>`}
function go(p){page=p;q='';pg=0;render()}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('main').innerHTML=({overview,matrix,assign,portal,dev}[page])();let input=$('query');if(input)input.addEventListener('input',e=>{q=e.target.value;pg=0;let pos=e.target.selectionStart;render();$('query').focus();$('query').setSelectionRange(pos,pos)})}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();</script></body></html>
