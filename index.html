let menuMod='All',menuSearch='',menuState='all',menuPage=0,menuOutside=false;
const statusNames={mapped:'Có nhóm quyền baseline',cross:'Tham chiếu khác module',group:'Đang gộp / cần chốt riêng',module:'Chính sách cấp module',pending:'Chưa chốt riêng',technical:'Quản trị kỹ thuật – chưa chốt riêng',node:'Node điều hướng',outside:'Ngoài phạm vi V7'};
const scanApplicable=r=>!r.only||r.only===cluster;
const scanTargets=(m,g)=>scanMenus.filter(r=>scanApplicable(r)&&r.targets.some(t=>t[0]===m&&t[1]===g));
function scanTag(){return '<span class="tag">Menu DEV</span>'}
function scanDetails(r){return `<details class="scan-detail"><summary>Thông tin kỹ thuật</summary><div>Menu ID: ${esc(r.id)} · ${esc(r.type||'Node')}</div><div>XML ID: ${esc(r.xml||'—')}</div><div>Action: ${esc(r.action||'—')} ${r.axml?'· '+esc(r.axml):''}</div><div>Groups trực tiếp: ${esc(r.groups||'Không khai báo trực tiếp')}</div><div>Model: ${esc(r.evidence||'Chưa xác minh')}</div></details>`}
function scanLinks(m,g){let rs=scanTargets(m,g);if(!rs.length)return '<div class="scan-unmapped">Chưa đối chiếu được menu riêng trong scan</div>';return `<details class="scan-inline"><summary>${rs.length} menu DEV ${scanTag()}</summary>${rs.map(r=>`<div class="scan-path">${esc(r.path)}<small>${esc(r.model||'Không xác định model')} ${r.module!==m?' · Vị trí menu thực tế khác module':''}</small>${r.status==='group'?'<small>Nhóm quyền gộp; cần chốt từng menu</small>':''}${scanDetails(r)}</div>`).join('')}</details>`}
function scanStatus(r){if(r.id==='559')return '<span class="pending">Model của anh Đô CENNOS – Chưa chốt</span>';return `<span class="scan-status ${['pending','group','technical'].includes(r.status)?'unconfirmed':''}">${esc(statusNames[r.status])}</span>`}
function scanPolicy(r){if(!r.targets.length)return r.status==='node'?'—':r.status==='outside'?'Ngoài baseline':'Chưa chốt quyền';return r.targets.map(t=>`${t[0]} / ${t[1]}`).map(esc).join('<br>')}
function scanExpected(r){if(r.id==='559')return '<span class="pending">Model của anh Đô CENNOS – Chưa chốt</span>';if(!r.targets.length||r.status==='group'||r.status==='technical')return '<span class="pending">Chưa chốt riêng</span>';let t=r.targets.find(t=>t[0]===mod)||r.targets[0],rs=D.matrix.filter(x=>x.module===t[0]&&x.group===t[1]&&(!x.only||x.only===cluster));if(!rs.length)return '<span class="pending">Chưa chốt riêng</span>';if(view==='all')return businessRoles.map(k=>`<div class="scan-role"><b>${esc(k)}</b> ${isPending(rs)?'Chưa chốt':noAccess(rs,roles.indexOf(k))?'<span class="deny">Không truy cập</span>':compact(rs,roles.indexOf(k))}</div>`).join('');return accessText(rs,ri());}
function scanModulePanel(){if(mod==='Portal')return `<div class="scan-section"><h3>Danh mục Portal Frontend ${scanTag()}</h3><p class="sub">Portal không có menu ir.ui.menu backend. Các trang / route từ baseline được giữ nguyên; scan chưa xác minh controller và quyền thực thi.</p>${tbl(['Trang / route','Odoo model'],D.portal.map(r=>[esc(r[2]),esc(r[3])]))}</div>`;let rs=scanMenus.filter(r=>r.module===mod&&r.status!=='node'&&scanApplicable(r)).sort((a,b)=>a.path.localeCompare(b.path,'en')||Number(a.id)-Number(b.id));if(!rs.length)return '';let missing=rs.filter(r=>['pending','group','technical'].includes(r.status));let matched=rs.filter(r=>!missing.includes(r));let section=(list,title,open)=>list.length?`<details class="scan-block" ${open?'open':''}><summary>${title} (${list.length})</summary>${tbl(['Menu thực tế','Odoo model','Nhóm quyền / trạng thái','Quyền yêu cầu tham chiếu'],list.map(r=>[(r.v9?changedCell: x=>x)(`<b>${esc(r.path.split('/').slice(1).join(' / ')||r.path)}</b>${scanDetails(r)}`),esc(r.model||'—'),scanStatus(r)+'<div class="scan-map">'+scanPolicy(r)+'</div>',scanExpected(r)]),'scan-table')}</details>`:'';return `<div class="scan-section"><h3>Menu thực tế trên DEV ${scanTag()}</h3><p class="sub">Danh mục scan 27/11/2026 · Không phải kết quả test quyền. Quyền tham chiếu baseline cập nhật V9; menu chưa chốt không tự cấp quyền.</p>${section(missing,'Menu cần chốt riêng',true)}${section(matched,'Menu đã có chính sách / nhóm quyền tham chiếu',!missing.length)}</div>`}
function scanInventory(){let all=scanMenus.filter(r=>(menuOutside||D.modules.includes(r.module))&&(menuMod==='All'||r.module===menuMod));let q=menuSearch.toLowerCase().trim();let rs=all.filter(r=>(menuState==='all'||(menuState==='todo'?['pending','group','technical'].includes(r.status):menuState==='action'?r.status!=='node':r.status===menuState))&&(!q||[r.path,r.model,r.id,r.xml,r.groups,r.action,r.targets.flat().join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.module.localeCompare(b.module)||a.path.localeCompare(b.path)||Number(a.id)-Number(b.id));let pages=Math.max(1,Math.ceil(rs.length/40));menuPage=Math.min(menuPage,pages-1);let modlist=[...new Set(scanMenus.filter(r=>menuOutside||D.modules.includes(r.module)).map(r=>r.module))].sort();return head('06 / DEV menu inventory','Danh mục menu DEV','Scan 27/11/2026 · Đối chiếu baseline V9')+`<div class="panel"><div class="scan-note"><b>V9 cập nhật các quyền vừa chốt; các quyền baseline còn lại giữ nguyên.</b> Tổng scan: 556 menu, 374 thuộc phạm vi 16 module (bao gồm node điều hướng). Portal có danh mục route riêng. Mapping dựa trên tên/alias từ audit; quyền thực tế chưa retest.</div><div class="tools"><select id="scanModule" onchange="menuMod=this.value;menuPage=0;render()"><option value="All">Tất cả module</option>${modlist.map(m=>`<option ${m===menuMod?'selected':''}>${esc(m)}</option>`).join('')}</select><select onchange="menuState=this.value;menuPage=0;render()">${[['all','Mọi trạng thái'],['action','Menu có action'],['todo','Cần chốt riêng'],['mapped','Có nhóm quyền'],['cross','Khác module'],['module','Chính sách cấp module'],['node','Node điều hướng']].map(([v,l])=>`<option value="${v}" ${menuState===v?'selected':''}>${l}</option>`).join('')}</select><input id="scanQuery" value="${esc(menuSearch)}" placeholder="Tìm menu, model, XML ID, group…"><label class="scan-check"><input type="checkbox" ${menuOutside?'checked':''} onchange="menuOutside=this.checked;menuMod='All';menuPage=0;render()"> Cả menu ngoài phạm vi</label></div><div class="tools"><span class="count">${rs.length} menu</span><button class="btn" ${menuPage===0?'disabled':''} onclick="menuPage--;render()">Trước</button><span>${menuPage+1}/${pages}</span><button class="btn" ${menuPage>=pages-1?'disabled':''} onclick="menuPage++;render()">Sau</button></div></div><div class="tablepanel">${tbl(['Menu / đường dẫn','Model / action','Nhóm quyền baseline','Groups khai báo trực tiếp'],rs.slice(menuPage*40,menuPage*40+40).map(r=>[(r.v9?changedCell: x=>x)(`<b>${esc(r.path)}</b>${scanDetails(r)}`),esc(r.model||'—')+'<div class="muted">'+esc(r.type||'Node điều hướng')+'</div>',scanStatus(r)+'<div class="scan-map">'+scanPolicy(r)+'</div>',esc(r.groups||'—')]),'scan-table')}</div><p class="source">Groups trống không chứng minh có quyền. Model có nhiều ứng viên giữ nguyên theo nguồn scan. Không xác minh quyền cộng dồn, record rules, controller, PROD hoặc thao tác CRUD theo Role.</p>`}

function go(p){page=p;q='';pg=0;render()}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('main').innerHTML=({overview,matrix,assign,portal,dev,scan:scanInventory}[page])();let scanInput=$('scanQuery');if(scanInput)scanInput.addEventListener('input',e=>{menuSearch=e.target.value;menuPage=0;let pos=e.target.selectionStart;render();$('scanQuery').focus();$('scanQuery').setSelectionRange(pos,pos)});let input=$('query');if(input)input.addEventListener('input',e=>{q=e.target.value;pg=0;let pos=e.target.selectionStart;render();$('query').focus();$('query').setSelectionRange(pos,pos)})}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();</script></body></html>
